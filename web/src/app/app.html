<mat-toolbar class="toolbar">
  <span class="brand">Personal Finance</span>

  @if (workbook.meta(); as meta) {
    <nav mat-tab-nav-bar [tabPanel]="panel" mat-stretch-tabs="false" class="tabs">
      @for (tab of tabs; track tab.path) {
        @if (!tab.holdingsOnly || meta.has_holdings) {
          <a
            mat-tab-link
            [routerLink]="tab.path"
            routerLinkActive
            #link="routerLinkActive"
            [active]="link.isActive"
          >
            {{ tab.label }}
          </a>
        }
      }
    </nav>
  }

  <span class="spacer"></span>

  @if (workbook.meta()) {
    <a mat-stroked-button routerLink="/upload" class="upload-wide">
      <mat-icon>upload_file</mat-icon>
      Upload new workbook
    </a>
    <a
      mat-icon-button
      routerLink="/upload"
      class="upload-narrow"
      matTooltip="Upload new workbook"
      aria-label="Upload new workbook"
    >
      <mat-icon>upload_file</mat-icon>
    </a>
  }
  <button
    mat-icon-button
    type="button"
    (click)="theme.toggle()"
    [matTooltip]="theme.mode() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
    [attr.aria-label]="theme.mode() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
  >
    <mat-icon>{{ theme.mode() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>
</mat-toolbar>

<mat-tab-nav-panel #panel>
  <main>
    <router-outlet />
  </main>
</mat-tab-nav-panel>
